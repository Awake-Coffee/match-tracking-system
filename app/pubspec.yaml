name: awake_ladder
description: "Awake Coffee chess, backgammon and Star Wars: Unlimited ladders for the cafe's regulars."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Bundled so text renders in the right face on the first frame instead of
  # swapping in after a runtime Google Fonts fetch.
  fonts:
    - family: Archivo Narrow
      fonts:
        - asset: assets/fonts/ArchivoNarrow-Medium.ttf
          weight: 500
        - asset: assets/fonts/ArchivoNarrow-Bold.ttf
          weight: 700
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
    - family: Big Shoulders Display
      fonts:
        - asset: assets/fonts/BigShouldersDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BigShouldersDisplay-ExtraBold.ttf
          weight: 800
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
    - family: GameMarks
      fonts:
        - asset: assets/fonts/GameMarks.ttf
    - family: Chakra Petch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
