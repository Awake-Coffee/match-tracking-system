name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter analyze and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6 # matches app/.metadata and scripts/vercel-build.sh
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  database:
    name: SQL tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # The runner image ships PostgreSQL server binaries; run.sh finds them.
      - run: supabase/tests/run.sh

  pending-migrations:
    name: Pending migrations
    # Secrets aren't available to pull requests from forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: List migrations this PR would apply to production
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL is not set; skipping."
            exit 0
          fi
          npx --yes supabase@2.119.0 db push --dry-run --db-url "$SUPABASE_DB_URL"
